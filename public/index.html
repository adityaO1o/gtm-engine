<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>InboxKit GTM Engine</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141922; --panel2:#1b212c; --line:#252c39;
    --txt:#e6e9ef; --dim:#8a93a6; --accent:#5b8cff;
    --hot:#ff5c5c; --warm:#ffb020; --cold:#5b8cff; --good:#2ecc71; --bad:#6b7280;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
  header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
  header .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);padding:2px 8px;border-radius:20px}
  .wrap{padding:22px 28px;max-width:1400px;margin:0 auto}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:26px;font-weight:680;letter-spacing:.5px}
  .stat .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
  .stat.hot .n{color:var(--hot)} .stat.warm .n{color:var(--warm)} .stat.cold .n{color:var(--cold)}
  .stat.good .n{color:var(--good)}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
  select,input{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:8px;font-size:13px;outline:none}
  input{min-width:220px}
  select:focus,input:focus{border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--panel2);cursor:pointer}
  .badge{display:inline-block;font-size:11px;font-weight:650;padding:2px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
  .b-hot{background:rgba(255,92,92,.15);color:var(--hot)}
  .b-warm{background:rgba(255,176,32,.15);color:var(--warm)}
  .b-cold{background:rgba(91,140,255,.15);color:var(--cold)}
  .em{font-size:11px;padding:2px 7px;border-radius:6px}
  .em-verified{background:rgba(46,204,113,.14);color:var(--good)}
  .em-no-email{background:rgba(107,114,128,.18);color:var(--dim)}
  .em-unverified{background:rgba(255,176,32,.14);color:var(--warm)}
  .em-role-based{background:rgba(107,114,128,.18);color:var(--dim)}
  .cats{display:flex;flex-wrap:wrap;gap:4px}
  .cat{font-size:10px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);padding:1px 6px;border-radius:5px}
  .score{font-weight:680;font-size:15px}
  .muted{color:var(--dim);font-size:12px}
  .name{font-weight:600}
  .seen{font-size:11px;color:var(--dim)}
  #empty{text-align:center;color:var(--dim);padding:40px}
  .drawer{position:fixed;top:0;right:0;width:420px;max-width:90vw;height:100vh;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:.2s;overflow-y:auto;z-index:10;padding:22px}
  .drawer.open{transform:translateX(0)}
  .drawer h3{margin:0 0 4px}
  .drawer .close{position:absolute;top:16px;right:18px;cursor:pointer;color:var(--dim);font-size:20px}
  .tl{border-left:2px solid var(--line);padding:10px 0 10px 16px;margin-left:6px;position:relative}
  .tl::before{content:"";position:absolute;left:-6px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .tl .c{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>InboxKit GTM Engine</h1>
  <span class="tag" id="proxytag">proxies —</span>
  <span class="tag" id="engtag">engagements —</span>
  <span style="flex:1"></span>
  <span class="muted" id="refreshed"></span>
</header>

<div class="wrap">
  <div class="stats" id="stats"></div>

  <div class="controls">
    <select id="f-status">
      <option value="">All status</option>
      <option value="hot">🔥 Hot</option>
      <option value="warm">🟡 Warm</option>
      <option value="cold">🔵 Cold</option>
    </select>
    <select id="f-email">
      <option value="">All emails</option>
      <option value="verified">Verified</option>
      <option value="no-email">No email (hand-off)</option>
      <option value="unverified">Unverified</option>
      <option value="role-based">Role-based</option>
    </select>
    <select id="f-cat">
      <option value="">All categories</option>
      <option>infra-competitor</option><option>deliverability</option>
      <option>infra</option><option>sequencer</option>
      <option>gtm-eng</option><option>data-tools</option><option>cold-email</option>
    </select>
    <select id="f-sort">
      <option value="score">Sort: score</option>
      <option value="recent">Sort: most recent</option>
    </select>
    <input id="f-q" placeholder="search name / email / company" />
  </div>

  <table>
    <thead><tr>
      <th>Name</th><th>Status</th><th>Score</th><th>Email</th>
      <th>Categories</th><th>Seen</th><th>Company</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" style="display:none">No leads yet. Publish a Trigify workflow and let a post flow through.</div>
</div>

<div class="drawer" id="drawer">
  <span class="close" onclick="closeDrawer()">×</span>
  <h3 id="d-name"></h3>
  <div class="muted" id="d-sub"></div>
  <div id="d-timeline" style="margin-top:18px"></div>
</div>

<script src="/app.js"></script>
</body>
</html>
