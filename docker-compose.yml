# Deploy on Dokploy as a Compose service.
# Set these in Dokploy's Environment tab (do NOT commit them):
#   INGEST_TOKEN, PROSPEO_KEY, ENRICH_KEY, SENDKIT_KEY, JINA_KEY, SERPER_KEYS, LINKEDIN_API_KEY, PROXIES,
#   MONGO_USER, MONGO_PASS, DASH_USER, DASH_PASS, BLACKLIST_API_KEY, BLACKLIST_WORKSPACE_ID

services:
  app:
    build:
      context: .
      # Set GIT_SHA in Dokploy's Environment tab to the deploy commit to surface it at /health.
      # Unset -> "unknown" (harmless). Not required for anything to work.
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    # Not published to the host — Traefik reaches it over the internal compose network.
    # (Publishing 3001 to the host would allow direct access that bypasses the proxy and
    #  lets a client spoof X-Forwarded-For to defeat the IP allowlist / rate limits.)
    expose:
      - "3001"
    environment:
      PORT: 3001
      # Overridable. `mongo` is a service alias, and on a shared Dokploy network that name can
      # resolve to a different stack's container — which looks like an empty database rather than a
      # connection error. Set MONGO_URI in Dokploy to the exact container name to pin it.
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DB: gtm
      INGEST_TOKEN: ${INGEST_TOKEN}
      PROSPEO_KEY: ${PROSPEO_KEY}
      ENRICH_KEY: ${ENRICH_KEY}
      ENRICH_LTE_KEY: ${ENRICH_LTE_KEY}
      TRIGIFY_KEY: ${TRIGIFY_KEY}
      JINA_KEY: ${JINA_KEY}
      SERPER_KEYS: ${SERPER_KEYS}
      LINKEDIN_API_KEY: ${LINKEDIN_API_KEY}
      LINKEDIN_API_HOST: ${LINKEDIN_API_HOST}
      SCRAPE_API_HOST: ${SCRAPE_API_HOST}
      # PND (professional-network-data) — separate RapidAPI account. This compose file passes env
      # through EXPLICITLY, so a var set in Dokploy but missing here never reaches the container.
      PND_API_KEY: ${PND_API_KEY}
      PND_API_HOST: ${PND_API_HOST}
      PND_CREDIT_FLOOR: ${PND_CREDIT_FLOOR}
      PND_MIN_GAP_MS: ${PND_MIN_GAP_MS}
      SEO_API_BASE: ${SEO_API_BASE}
      BOUNCEBAN_KEY: ${BOUNCEBAN_KEY}
      SENDKIT_KEY: ${SENDKIT_KEY}
      SENDKIT_WORKSPACES: ${SENDKIT_WORKSPACES:-}
      BLACKLIST_API_KEY: ${BLACKLIST_API_KEY}
      BLACKLIST_WORKSPACE_ID: ${BLACKLIST_WORKSPACE_ID}
      BLACKLIST_API_BASE: ${BLACKLIST_API_BASE:-}
      HOSTIO_TOKEN: ${HOSTIO_TOKEN:-}
      HOSTIO_PAGE_CONCURRENCY: ${HOSTIO_PAGE_CONCURRENCY:-}
      HOSTIO_SCRAPE_PER_PROXY: ${HOSTIO_SCRAPE_PER_PROXY:-}
      HOSTIO_SCRAPE_PROXIES: ${HOSTIO_SCRAPE_PROXIES:-}
      WEBSHARE_GATEWAY: ${WEBSHARE_GATEWAY:-}
      WEBSHARE_USERNAME: ${WEBSHARE_USERNAME:-}
      WEBSHARE_PASSWORD: ${WEBSHARE_PASSWORD:-}
      WEBSHARE_PROXY_USERNAME: ${WEBSHARE_PROXY_USERNAME:-}
      WEBSHARE_PROXY_PASSWORD: ${WEBSHARE_PROXY_PASSWORD:-}
      WEBSHARE_PROXY_HOST: ${WEBSHARE_PROXY_HOST:-}
      WEBSHARE_PROXY_PORT: ${WEBSHARE_PROXY_PORT:-}
      CAMPAIGN_COUNT_GATE: ${CAMPAIGN_COUNT_GATE:-}
      CAMPAIGN_BLACKLIST_GATE: ${CAMPAIGN_BLACKLIST_GATE:-}
      CAMPAIGN_MAX_API_PAGES: ${CAMPAIGN_MAX_API_PAGES:-}
      CAMPAIGN_SEED_CONCURRENCY: ${CAMPAIGN_SEED_CONCURRENCY:-}
      CAMPAIGN_ENRICH_CONCURRENCY: ${CAMPAIGN_ENRICH_CONCURRENCY:-}
      CAMPAIGN_REVEAL_PER_COMPANY: ${CAMPAIGN_REVEAL_PER_COMPANY:-}
      HOSTIO_MIN_GAP_MS: ${HOSTIO_MIN_GAP_MS:-}
      HOSTIO_PROXY_MIN_GAP_MS: ${HOSTIO_PROXY_MIN_GAP_MS:-}
      CAMPAIGN_API_FALLBACK: ${CAMPAIGN_API_FALLBACK:-}
      # Read by the code but previously absent here, so they could be set and still never arrive —
      # the same silent trap that hid WEBSHARE_GATEWAY and CAMPAIGN_API_FALLBACK.
      ALLOW_IPS: ${ALLOW_IPS:-}
      # Hosts that serve ONLY the public /r/<token> reports (everything else redirects away, so a
      # prospect never meets the dashboard login). Defaults in code to blacklist-report.com; listed
      # here so adding report.inboxkit.com later is a Dokploy env edit, not a code change.
      REPORT_HOSTS: ${REPORT_HOSTS:-}
      REPORT_HOME_URL: ${REPORT_HOME_URL:-}
      GIT_SHA: ${GIT_SHA:-}
      INTAKE_SENDKIT_ID: ${INTAKE_SENDKIT_ID:-}
      JINA_DIRECT: ${JINA_DIRECT:-}
      RAPID_FRESH_PLAN: ${RAPID_FRESH_PLAN:-}
      RAPID_WEBSCRAPE_PLAN: ${RAPID_WEBSCRAPE_PLAN:-}
      SCRAPE_MIN_GAP_MS: ${SCRAPE_MIN_GAP_MS:-}
      SENDKIT_BASE: ${SENDKIT_BASE:-}
      SENDKIT_BLACKLIST_CAMPAIGN_ID: ${SENDKIT_BLACKLIST_CAMPAIGN_ID:-}
      USE_OLD_UI: ${USE_OLD_UI:-}
      PROSPEO_MIN_GAP_MS: ${PROSPEO_MIN_GAP_MS:-}
      SCAN_DNS_CONCURRENCY: ${SCAN_DNS_CONCURRENCY:-}
      SCAN_REDIRECT_CONCURRENCY: ${SCAN_REDIRECT_CONCURRENCY:-}
      SCAN_REDIRECT_TIMEOUT_MS: ${SCAN_REDIRECT_TIMEOUT_MS:-}
      SCAN_DNS_TIMEOUT_MS: ${SCAN_DNS_TIMEOUT_MS:-}
      PROXIES: ${PROXIES}
      DASH_USER: ${DASH_USER}
      DASH_PASS: ${DASH_PASS}
      PROXY_TIMEOUT_MS: 20000
      SCRAPE_RETRIES: 4
      # Auto engine + caches — all optional (config.js has defaults); set in Dokploy to tune.
      AUTO_SWEEP_HOURS: ${AUTO_SWEEP_HOURS:-}
      AUTO_ROTATE_UTC_HOUR: ${AUTO_ROTATE_UTC_HOUR:-}
      AUTO_PER_LIST: ${AUTO_PER_LIST:-25}
      AUTO_MAX_POSTS_PER_DAY: ${AUTO_MAX_POSTS_PER_DAY:-300}
      AUTO_MIN_CREDITS: ${AUTO_MIN_CREDITS:-}
      AUTO_POST_MAX_AGE_DAYS: ${AUTO_POST_MAX_AGE_DAYS:-}
      BOUNCEBAN_CACHE_DAYS: ${BOUNCEBAN_CACHE_DAYS:-}
    depends_on:
      - mongo

  # The Node worker — SECOND process, same image. The web container serves Trigify's per-engager
  # /enrich calls and the dashboard; neither can afford to queue behind a client scan, which is why
  # the long work runs here instead. Both lease from the same `jobs` collection.
  worker:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DB: gtm
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      # Same downstreams the funnel uses — the worker runs the real scan, not a copy of it.
      PROSPEO_KEY: ${PROSPEO_KEY}
      ENRICH_KEY: ${ENRICH_KEY}
      SENDKIT_KEY: ${SENDKIT_KEY}
      INGEST_TOKEN: ${INGEST_TOKEN}
      BLACKLIST_API_KEY: ${BLACKLIST_API_KEY}
      BLACKLIST_WORKSPACE_ID: ${BLACKLIST_WORKSPACE_ID}
      BLACKLIST_API_BASE: ${BLACKLIST_API_BASE:-}
      HOSTIO_TOKEN: ${HOSTIO_TOKEN:-}
      HOSTIO_MIN_GAP_MS: ${HOSTIO_MIN_GAP_MS:-}
      HOSTIO_PROXY_MIN_GAP_MS: ${HOSTIO_PROXY_MIN_GAP_MS:-}
      CAMPAIGN_API_FALLBACK: ${CAMPAIGN_API_FALLBACK:-}
      CAMPAIGN_BLACKLIST_GATE: ${CAMPAIGN_BLACKLIST_GATE:-}
      CAMPAIGN_ENRICH_CONCURRENCY: ${CAMPAIGN_ENRICH_CONCURRENCY:-}
      CAMPAIGN_REVEAL_PER_COMPANY: ${CAMPAIGN_REVEAL_PER_COMPANY:-}
      PROSPEO_MIN_GAP_MS: ${PROSPEO_MIN_GAP_MS:-}
      REPORT_PUBLIC_URL: ${REPORT_PUBLIC_URL:-}
      PROXIES: ${PROXIES}
    depends_on:
      - mongo

  # The Go crawler — the fetch-heavy half. Shares nothing with the platform but the Mongo
  # collections: no RPC, no generated stubs. Scale `replicas` when the crawl is the bottleneck; it
  # never is when the blacklist checker is.
  crawler:
    build:
      context: ./crawler
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DB: gtm
      CRAWL_CONCURRENCY: ${CRAWL_CONCURRENCY:-64}
      CRAWL_MAX_CASE_STUDIES: ${CRAWL_MAX_CASE_STUDIES:-40}
      PROXIES: ${PROXIES}
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    restart: unless-stopped
    # No published ports — Mongo is reachable ONLY from the app on the private compose
    # network, never from the internet. That network isolation is the security boundary.
    # (Root-user auth via compose interpolation fought Dokploy's volume handling; the
    #  internet-facing surface is locked down separately: dashboard basic-auth, rate
    #  limiting, ingest token.) Fresh volume name to escape the stale auth-enabled volume.
    volumes:
      - gtm_data_open:/data/db

volumes:
  gtm_data_open:
