# Deploy on Dokploy as a Compose service.
# Set these in Dokploy's Environment tab (do NOT commit them):
#   INGEST_TOKEN, PROSPEO_KEY, ENRICH_KEY, SENDKIT_KEY, PROXIES,
#   MONGO_USER, MONGO_PASS, DASH_USER, DASH_PASS

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/gtm?authSource=admin
      MONGO_DB: gtm
      INGEST_TOKEN: ${INGEST_TOKEN}
      PROSPEO_KEY: ${PROSPEO_KEY}
      ENRICH_KEY: ${ENRICH_KEY}
      SENDKIT_KEY: ${SENDKIT_KEY}
      PROXIES: ${PROXIES}
      DASH_USER: ${DASH_USER}
      DASH_PASS: ${DASH_PASS}
      PROXY_TIMEOUT_MS: 20000
      SCRAPE_RETRIES: 4
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    # NOTE: no ports published — Mongo is only reachable inside the compose network,
    # never from the internet. The root credentials are defence-in-depth.
    volumes:
      - gtm_mongo_secure:/data/db

volumes:
  gtm_mongo_secure:
