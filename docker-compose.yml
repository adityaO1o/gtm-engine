# Deploy on Dokploy as a Compose service.
# Set these in Dokploy's Environment tab (do NOT commit them):
#   INGEST_TOKEN, PROSPEO_KEY, ENRICH_KEY, SENDKIT_KEY, JINA_KEY, SERPER_KEYS, LINKEDIN_API_KEY, PROXIES,
#   MONGO_USER, MONGO_PASS, DASH_USER, DASH_PASS

services:
  app:
    build:
      context: .
      # Set GIT_SHA in Dokploy's Environment tab to the deploy commit to surface it at /health.
      # Unset -> "unknown" (harmless). Not required for anything to work.
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    # Not published to the host — Traefik reaches it over the internal compose network.
    # (Publishing 3001 to the host would allow direct access that bypasses the proxy and
    #  lets a client spoof X-Forwarded-For to defeat the IP allowlist / rate limits.)
    expose:
      - "3001"
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: gtm
      INGEST_TOKEN: ${INGEST_TOKEN}
      PROSPEO_KEY: ${PROSPEO_KEY}
      ENRICH_KEY: ${ENRICH_KEY}
      ENRICH_LTE_KEY: ${ENRICH_LTE_KEY}
      TRIGIFY_KEY: ${TRIGIFY_KEY}
      JINA_KEY: ${JINA_KEY}
      SERPER_KEYS: ${SERPER_KEYS}
      LINKEDIN_API_KEY: ${LINKEDIN_API_KEY}
      LINKEDIN_API_HOST: ${LINKEDIN_API_HOST}
      SCRAPE_API_HOST: ${SCRAPE_API_HOST}
      # PND (professional-network-data) — separate RapidAPI account. This compose file passes env
      # through EXPLICITLY, so a var set in Dokploy but missing here never reaches the container.
      PND_API_KEY: ${PND_API_KEY}
      PND_API_HOST: ${PND_API_HOST}
      PND_CREDIT_FLOOR: ${PND_CREDIT_FLOOR}
      PND_MIN_GAP_MS: ${PND_MIN_GAP_MS}
      SEO_API_BASE: ${SEO_API_BASE}
      BOUNCEBAN_KEY: ${BOUNCEBAN_KEY}
      SENDKIT_KEY: ${SENDKIT_KEY}
      PROXIES: ${PROXIES}
      DASH_USER: ${DASH_USER}
      DASH_PASS: ${DASH_PASS}
      internal_USER: ${internal_USER}
      internal_PASS: ${internal_PASS}
      PROXY_TIMEOUT_MS: 20000
      SCRAPE_RETRIES: 4
      # Auto engine + caches — all optional (config.js has defaults); set in Dokploy to tune.
      AUTO_SWEEP_HOURS: ${AUTO_SWEEP_HOURS:-}
      AUTO_ROTATE_UTC_HOUR: ${AUTO_ROTATE_UTC_HOUR:-}
      AUTO_PER_LIST: ${AUTO_PER_LIST:-}
      AUTO_MAX_POSTS_PER_DAY: ${AUTO_MAX_POSTS_PER_DAY:-}
      AUTO_MIN_CREDITS: ${AUTO_MIN_CREDITS:-}
      AUTO_POST_MAX_AGE_DAYS: ${AUTO_POST_MAX_AGE_DAYS:-}
      BOUNCEBAN_CACHE_DAYS: ${BOUNCEBAN_CACHE_DAYS:-}
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    restart: unless-stopped
    # No published ports — Mongo is reachable ONLY from the app on the private compose
    # network, never from the internet. That network isolation is the security boundary.
    # (Root-user auth via compose interpolation fought Dokploy's volume handling; the
    #  internet-facing surface is locked down separately: dashboard basic-auth, rate
    #  limiting, ingest token.) Fresh volume name to escape the stale auth-enabled volume.
    volumes:
      - gtm_data_open:/data/db

volumes:
  gtm_data_open:
